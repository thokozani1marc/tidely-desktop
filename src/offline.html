<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Tidely POS</title>
<style>
  html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6fa;color:#1b2430}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  h1{font-size:26px;margin:0 0 8px}
  p{margin:0 0 20px;color:#556070;max-width:420px;line-height:1.5}
  button{font-size:16px;padding:12px 28px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  small{margin-top:16px;color:#8a94a3}
</style>
</head>
<body>
<div class="box">
  <h1>No internet connection</h1>
  <p>Tidely POS needs the internet to load. Check the Wi-Fi or network cable. We will keep trying automatically.</p>
  <button id="retry">Try again</button>
  <small id="status"></small>
</div>
<script>
  var btn = document.getElementById('retry');
  var status = document.getElementById('status');
  function retry() {
    btn.disabled = true;
    status.textContent = 'Trying…';
    window.tidelyDesktop.reload().then(function () {
      setTimeout(function () { btn.disabled = false; status.textContent = ''; }, 4000);
    });
  }
  btn.addEventListener('click', retry);
  setInterval(function () { if (navigator.onLine) retry(); }, 10000);
  window.addEventListener('online', retry);
</script>
</body>
</html>
