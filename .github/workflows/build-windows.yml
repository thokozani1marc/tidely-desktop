name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish as a GitHub Release (gives a public download link)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Tidely-POS-Setup
          path: |
            dist/Tidely-POS-Setup.exe
            dist/Tidely-POS-Setup.exe.blockmap
            dist/latest.yml
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: Tidely POS desktop 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            dist/Tidely-POS-Setup.exe
            dist/Tidely-POS-Setup.exe.blockmap
            dist/latest.yml
