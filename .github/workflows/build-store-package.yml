name: Build Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Package/Identity/Name from Partner Center (Product identity page)"
        required: true
      publisher:
        description: "Package/Identity/Publisher from Partner Center (starts with CN=)"
        required: true
      publisher_display_name:
        description: "Package/Properties/PublisherDisplayName from Partner Center"
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      IDENTITY_NAME: ${{ inputs.identity_name }}
      PUBLISHER: ${{ inputs.publisher }}
      PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build MSIX/APPX package
        run: npx electron-builder --win appx --x64 --publish never "-c.appx.identityName=$env:IDENTITY_NAME" "-c.appx.publisher=$env:PUBLISHER" "-c.appx.publisherDisplayName=$env:PUBLISHER_DISPLAY_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: Tidely-POS-Store-Package
          path: dist/*.appx
